[package]
name = "coinjoin-signer"
version = "0.4.0"
edition = "2021"

[workspace]
exclude = [".foundation-sdk"]

[workspace.dependencies]
# Same revision KeyOS itself builds against, so the engine crate stays drop-in
# for the firmware proposal branch.
ngwallet = { git = "https://github.com/Foundation-Devices/ngwallet", tag = "2.15.0", features = [
    "rkyv",
    "sha2",
] }

[features]
# The USB HID transport. Needs the os/usbdev grants of app-config.usb.toml, which the SDK
# refuses to build and KeyOS reserves for Foundation-signed apps (docs/keyos-usbdev-request.md).
usb = ["dep:usbdev"]

[dependencies]
log = "0.4"
# Coinjoin remote-signing engine: policy, SLIP-0019 proofs, sessions, signing.
wallet-rpc-core = { path = "crates/wallet-rpc-core" }
# App-scoped seed (GetAppSeed) and secure-element randomness (os/security).
security = { path = ".foundation-sdk/current/lib/keyos/api/security" }
# The os/usbdev client the SDK does not ship (vendor/usbdev); only the usb flavour links it.
usbdev = { path = "vendor/usbdev", optional = true }
xous = { path = ".foundation-sdk/current/lib/keyos/xous/xous-rs" }
# Airlock file export of the Wasabi wallet file (os/fs).
fs = { path = ".foundation-sdk/current/lib/keyos/api/fs" }
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
serde = { version = "1.0", features = ["derive"] }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build" }

# Randomness is pre-wired: add `getrandom = "0.2"` (or `rand = "0.8"`) and calls
# route to the TRNG on device. Stay on the getrandom 0.2 line; 0.3+ is uncovered.
[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }
