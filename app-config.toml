# Foundation application configuration
app-name = "coinjoin-signer"
friendly-app-name = "Coinjoin Signer"
launcher-app-name = "Coinjoin"
description = "Unattended WabiSabi coinjoin signer for Wasabi Wallet"
icon = "resources/icon.svg"
theme = "resources/theme.json"
app-id = "0xab896a3044253d9da49f1bcc6499aaf9"
min-keyos-version = "1.4.0"

[publisher]
name = "coinjoin.nl"
contact-email = "hello@coinjoin.nl"
support-url = "https://coinjoin.nl/"

[permissions]
template = ["gui-app"]
"os/settings" = ["GetDeviceName", "GetLocale", "GetPrimeColor"]
# GetAppSeed: read once per session, at authorization, to derive the coinjoin
# account keys (KeyOS asks the user once, then remembers the grant).
# GetRandom: secure-element entropy for the session token.
"os/security" = ["GetAppSeed", "GetRandom"]
# Write the Wasabi wallet file to the Airlock (user grants Airlock access once).
"os/fs" = ["CreateDirMessage", "WriteFile", "Flush", "GetAirlockWriteAccess"]
